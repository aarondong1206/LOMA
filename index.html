<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOMA 章节打卡计划</title>
<style>
:root {
  --bg: #f5f7fb;
  --card: #ffffff;
  --text: #172033;
  --muted: #64748b;
  --line: #dbe3ef;
  --primary: #0f766e;
  --primary-light: #14b8a6;
  --blue: #2563eb;
  --success: #15803d;
  --danger: #dc2626;
  --radius: 8px;
  --shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
}
* { box-sizing: border-box; }
html { min-height: 100%; }
body {
  margin: 0;
  min-height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--text);
  background: var(--bg);
  letter-spacing: 0;
  padding-bottom: 78px;
}
button, input { font: inherit; }
button { cursor: pointer; }
.shell {
  width: min(1080px, 100%);
  margin: 0 auto;
  padding: 14px 14px 24px;
}
.header {
  color: #fff;
  background:
    linear-gradient(135deg, rgba(15, 118, 110, 0.96), rgba(37, 99, 235, 0.9)),
    linear-gradient(45deg, #0f766e, #2563eb);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
}
.eyebrow {
  font-size: 12px;
  font-weight: 800;
  opacity: 0.84;
  margin-bottom: 6px;
}
h1 {
  margin: 0;
  font-size: clamp(24px, 5vw, 38px);
  line-height: 1.08;
  letter-spacing: 0;
}
.subtitle {
  margin-top: 8px;
  max-width: 760px;
  font-size: 13px;
  line-height: 1.5;
  opacity: 0.9;
}
.total-progress {
  margin-top: 16px;
}
.progress-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  font-weight: 800;
}
.progress-track {
  height: 10px;
  margin-top: 8px;
  border-radius: 999px;
  background: rgba(255,255,255,0.24);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, #facc15, #ffffff);
  transition: width 0.25s ease;
}
.header-metrics,
.metric-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin-top: 14px;
}
.header-metric {
  min-width: 0;
  border: 1px solid rgba(255,255,255,0.22);
  background: rgba(255,255,255,0.12);
  border-radius: var(--radius);
  padding: 10px;
}
.header-metric-label {
  font-size: 11px;
  opacity: 0.82;
  white-space: nowrap;
}
.header-metric-value {
  margin-top: 4px;
  font-size: 17px;
  font-weight: 900;
  line-height: 1.2;
  overflow-wrap: anywhere;
}
.page {
  display: none;
  padding-top: 14px;
}
.page.active { display: block; }
.section-title {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  margin: 12px 0 10px;
  font-size: 15px;
  font-weight: 900;
}
.section-note {
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
}
.card,
.course-card,
.chapter-item,
.panel,
.metric-card,
.unit-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.card,
.course-card,
.panel,
.metric-card,
.unit-card {
  padding: 14px;
}
.metric-grid { margin-top: 0; }
.metric-card { min-width: 0; }
.metric-label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}
.metric-value {
  margin-top: 6px;
  color: var(--primary);
  font-size: 24px;
  line-height: 1.08;
  font-weight: 900;
}
.metric-sub {
  margin-top: 6px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
}
.today-card {
  border-left: 4px solid var(--primary);
}
.today-title {
  margin-bottom: 6px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 800;
}
.today-main {
  font-size: 15px;
  line-height: 1.35;
  font-weight: 900;
}
.today-meta {
  margin-top: 8px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
}
.course-grid,
.structure-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.course-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}
.course-name {
  font-size: 16px;
  font-weight: 900;
  line-height: 1.25;
}
.course-pct {
  flex: 0 0 auto;
  color: var(--primary);
  font-size: 24px;
  line-height: 1;
  font-weight: 900;
}
.course-stats {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 12px;
  margin-top: 10px;
  color: var(--muted);
  font-size: 12px;
}
.course-stats strong { color: var(--text); }
.mini-track {
  margin-top: 12px;
  height: 7px;
  background: #e8eef6;
  border-radius: 999px;
  overflow: hidden;
}
.mini-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--primary), var(--primary-light));
}
.unit-row {
  display: grid;
  grid-template-columns: 82px minmax(0, 1fr) auto;
  gap: 8px;
  padding: 8px 0;
  border-top: 1px dashed var(--line);
  margin-top: 8px;
  align-items: center;
}
.unit-label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
}
.unit-name {
  min-width: 0;
  font-size: 12px;
  line-height: 1.35;
}
.unit-pct {
  color: var(--primary);
  font-size: 12px;
  font-weight: 900;
}
.filter-bar {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding-bottom: 2px;
  margin-bottom: 10px;
}
.filter-bar::-webkit-scrollbar { display: none; }
.filter-btn,
.utility-btn {
  flex: 0 0 auto;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--muted);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 800;
}
.filter-btn.active,
.utility-btn.primary {
  color: #fff;
  border-color: var(--primary);
  background: var(--primary);
}
.search-wrap {
  position: relative;
  margin-bottom: 10px;
}
.search-input {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--text);
  border-radius: 999px;
  padding: 10px 12px;
  outline: none;
  font-size: 13px;
}
.search-input:focus { border-color: var(--primary); }
.chapter-list {
  display: grid;
  gap: 8px;
}
.chapter-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px;
  cursor: pointer;
  transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
}
.chapter-item:active { transform: scale(0.99); }
.chapter-item.done {
  background: #f0fdf4;
  border-color: #bbf7d0;
}
.chapter-item.today:not(.done) {
  border-color: rgba(15, 118, 110, 0.55);
}
.chapter-item.overdue:not(.done) {
  border-color: rgba(220, 38, 38, 0.28);
  background: #fff7f7;
}
.check {
  flex: 0 0 auto;
  width: 28px;
  height: 28px;
  border: 2px solid var(--line);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  background: #fff;
  font-size: 14px;
  font-weight: 900;
}
.chapter-item.done .check {
  background: var(--success);
  border-color: var(--success);
}
.chapter-info {
  min-width: 0;
  flex: 1;
}
.chapter-title {
  font-size: 13px;
  font-weight: 850;
  line-height: 1.4;
}
.chapter-item.done .chapter-title {
  color: var(--muted);
  text-decoration: line-through;
  text-decoration-color: #86efac;
}
.chapter-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 6px;
}
.tag {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  background: #eef6f5;
  color: var(--primary);
  padding: 2px 7px;
  font-size: 11px;
  font-weight: 800;
}
.tag.blue {
  background: #eff6ff;
  color: var(--blue);
}
.tag.gray {
  background: #f1f5f9;
  color: var(--muted);
}
.chapter-note {
  margin-top: 8px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.48;
}
.unit-card-title {
  font-size: 14px;
  line-height: 1.3;
  font-weight: 900;
}
.unit-card-sub {
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
}
.structure-chapter {
  padding: 10px 0;
  border-top: 1px dashed var(--line);
}
.structure-chapter:first-of-type { margin-top: 8px; }
.structure-chapter-title {
  font-size: 13px;
  line-height: 1.4;
  font-weight: 750;
}
.structure-chapter-meta {
  margin-top: 5px;
  color: var(--muted);
  font-size: 11px;
  display: flex;
  justify-content: space-between;
  gap: 10px;
}
.empty {
  padding: 36px 16px;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
}
.utility-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.hidden-file { display: none; }
.toast {
  position: fixed;
  left: 50%;
  bottom: 88px;
  transform: translateX(-50%) translateY(20px);
  opacity: 0;
  pointer-events: none;
  z-index: 200;
  background: #172033;
  color: #fff;
  border-radius: 999px;
  padding: 10px 18px;
  font-size: 13px;
  font-weight: 800;
  transition: all 0.24s ease;
  white-space: nowrap;
}
.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}
.bottom-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  z-index: 120;
  border-top: 1px solid var(--line);
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(14px);
  padding: 8px 0 env(safe-area-inset-bottom, 8px);
}
.nav-btn {
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  padding: 5px 0;
}
.nav-btn.active { color: var(--primary); }
@media (max-width: 760px) {
  .shell { padding: 10px 10px 20px; }
  .header { padding: 16px; }
  .header-metrics,
  .metric-grid,
  .course-grid,
  .structure-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .unit-row { grid-template-columns: 74px minmax(0, 1fr) auto; }
}
@media (max-width: 460px) {
  .header-metrics,
  .metric-grid,
  .course-grid,
  .structure-grid {
    grid-template-columns: 1fr;
  }
  .chapter-item { padding: 11px; }
}
</style>
</head>
<body>
<main class="shell">
  <header class="header">
    <div class="eyebrow">LOMA 302 + LOMA 311</div>
    <h1>章节打卡计划</h1>
    <div class="subtitle">从 2026年9月20日开始，每天安排 1 个章节。你完成后勾选打卡；全部章节打卡完成，本项目即结束。</div>
    <div class="total-progress">
      <div class="progress-row">
        <span>总进度</span>
        <span id="headerProgressText">0 / 0</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="headerProgressFill"></div>
      </div>
    </div>
    <div class="header-metrics" id="headerMetrics"></div>
  </header>

  <section class="page active" id="page-progress">
    <div class="section-title">
      <span>今日与总览</span>
      <span class="section-note" id="todayDateNote"></span>
    </div>
    <div class="metric-grid" id="overviewMetrics"></div>

    <div class="section-title">
      <span>下一章</span>
      <span class="section-note">按计划日期自动定位</span>
    </div>
    <div class="card today-card" id="todayCard"></div>

    <div class="section-title">
      <span>课程完成度</span>
      <span class="section-note">按章节数统计</span>
    </div>
    <div class="course-grid" id="courseGrid"></div>
  </section>

  <section class="page" id="page-schedule">
    <div class="section-title">
      <span>章节日程</span>
      <span class="section-note" id="scheduleNote"></span>
    </div>
    <div class="filter-bar" id="scheduleFilters"></div>
    <div class="search-wrap">
      <input class="search-input" id="scheduleSearch" type="search" placeholder="搜索课程、单元、章节或日期" oninput="renderSchedule()">
    </div>
    <div class="chapter-list" id="scheduleList"></div>
  </section>

  <section class="page" id="page-structure">
    <div class="section-title">
      <span>课程结构</span>
      <span class="section-note">课程 - 单元 - 章节</span>
    </div>
    <div class="structure-grid" id="structureGrid"></div>
  </section>

  <section class="page" id="page-backup">
    <div class="section-title">
      <span>进度数据</span>
      <span class="section-note">本机浏览器保存</span>
    </div>
    <div class="metric-grid" id="backupMetrics"></div>
    <div class="section-title">
      <span>备份</span>
      <span class="section-note">导入会覆盖当前本机记录</span>
    </div>
    <div class="panel utility-row">
      <button class="utility-btn primary" type="button" onclick="exportProgress()">导出进度</button>
      <button class="utility-btn" type="button" onclick="document.getElementById('importFile').click()">导入进度</button>
      <button class="utility-btn" type="button" onclick="resetProgress()">清空进度</button>
      <input class="hidden-file" id="importFile" type="file" accept="application/json" onchange="importProgress(event)">
    </div>
  </section>
</main>

<nav class="bottom-nav" aria-label="页面导航">
  <button class="nav-btn active" id="nav-progress" type="button" onclick="switchPage('progress')">进度</button>
  <button class="nav-btn" id="nav-schedule" type="button" onclick="switchPage('schedule')">日程</button>
  <button class="nav-btn" id="nav-structure" type="button" onclick="switchPage('structure')">结构</button>
  <button class="nav-btn" id="nav-backup" type="button" onclick="switchPage('backup')">备份</button>
</nav>
<div class="toast" id="toast"></div>

<script>
const PLAN = {
  startDate: '2026-09-20',
  courses: [
    {
      id: '302',
      name: 'LOMA 302',
      fullName: '保单的生命周期：寿险公司的行政业务管理',
      note: '4 单元，11 课。',
      units: [
        { id: '302-u1', name: '寿险行政业务管理及核保概论' },
        { id: '302-u2', name: '特定类型寿险的核保' },
        { id: '302-u3', name: '客户服务' },
        { id: '302-u4', name: '理赔管理' }
      ]
    },
    {
      id: '311',
      name: 'LOMA 311',
      fullName: '保险行业法律',
      note: '4 单元，14 章。',
      units: [
        { id: '311-u1', name: '人寿保险公司和法律问题' },
        { id: '311-u2', name: '商业法领域' },
        { id: '311-u3', name: '人寿保险业务的监管' },
        { id: '311-u4', name: '产品销售与合同履行' }
      ]
    }
  ],
  items: [
    { id: '302-1-1', course: '302', unit: '302-u1', label: '第1课', title: '寿险行政业务管理概论' },
    { id: '302-1-2', course: '302', unit: '302-u1', label: '第2课', title: '新业务流程和核保准则' },
    { id: '302-1-3', course: '302', unit: '302-u1', label: '第3课', title: '个人寿险：评估死亡风险' },
    { id: '302-1-4', course: '302', unit: '302-u1', label: '第4课', title: '个人寿险：财务核保和风险分类' },
    { id: '302-2-1', course: '302', unit: '302-u2', label: '第1课', title: '特定类型的寿险和补充性给付的核保' },
    { id: '302-2-2', course: '302', unit: '302-u2', label: '第2课', title: '团体寿险的核保' },
    { id: '302-3-1', course: '302', unit: '302-u3', label: '第1课', title: '有效的客户服务' },
    { id: '302-3-2', course: '302', unit: '302-u3', label: '第2课', title: '保单所有人服务' },
    { id: '302-4-1', course: '302', unit: '302-u4', label: '第1课', title: '理赔管理概述' },
    { id: '302-4-2', course: '302', unit: '302-u4', label: '第2课', title: '寿险理赔的管理' },
    { id: '302-4-3', course: '302', unit: '302-u4', label: '第3课', title: '理赔评估过程' },

    { id: '311-1', course: '311', unit: '311-u1', label: '第1章', title: '人寿保险公司的法律环境' },
    { id: '311-2', course: '311', unit: '311-u1', label: '第2章', title: '民事纠纷' },
    { id: '311-3', course: '311', unit: '311-u1', label: '第3章', title: '从事被监管业务的人寿保险公司' },
    { id: '311-4', course: '311', unit: '311-u2', label: '第4章', title: '合同法' },
    { id: '311-5', course: '311', unit: '311-u2', label: '第5章', title: '代理法' },
    { id: '311-6', course: '311', unit: '311-u2', label: '第6章', title: '物权法和商业交易' },
    { id: '311-7', course: '311', unit: '311-u3', label: '第7章', title: '人寿保险行业的监管' },
    { id: '311-8', course: '311', unit: '311-u3', label: '第8章', title: '产品和业务的监管' },
    { id: '311-9', course: '311', unit: '311-u3', label: '第9章', title: '团体合同和监管' },
    { id: '311-10', course: '311', unit: '311-u4', label: '第10章', title: '人寿保险和年金产品的销售' },
    { id: '311-11', course: '311', unit: '311-u4', label: '第11章', title: '人寿保险和年金产品的所有权' },
    { id: '311-12', course: '311', unit: '311-u4', label: '第12章', title: '第三方权利' },
    { id: '311-13', course: '311', unit: '311-u4', label: '第13章', title: '提出抗辩的保单和民事补救' },
    { id: '311-14', course: '311', unit: '311-u4', label: '第14章', title: '合同的履行' }
  ]
};

const STORAGE_KEY = 'loma_chapter_checkins_v2';
const courseById = Object.fromEntries(PLAN.courses.map(course => [course.id, course]));
const unitById = Object.fromEntries(PLAN.courses.flatMap(course => course.units.map(unit => [unit.id, { ...unit, course: course.id }])));
let completions = {};
let chapters = [];
let currentPage = 'progress';
let scheduleFilter = 'all';

function escapeHtml(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function dateFromKey(key) {
  const [year, month, day] = key.split('-').map(Number);
  return new Date(year, month - 1, day);
}

function localDateKey(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function addDays(key, days) {
  const date = dateFromKey(key);
  date.setDate(date.getDate() + days);
  return localDateKey(date);
}

function formatDate(key) {
  const date = dateFromKey(key);
  const week = ['日', '一', '二', '三', '四', '五', '六'][date.getDay()];
  return `${Number(key.slice(5, 7))}月${Number(key.slice(8, 10))}日 周${week}`;
}

function prepareChapters() {
  chapters = PLAN.items.map((item, index) => ({
    ...item,
    date: addDays(PLAN.startDate, index),
    sequence: index + 1
  }));
}

function loadProgress() {
  try {
    const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    completions = parsed.completedAtById || {};
  } catch {
    completions = {};
  }
}

function saveProgress() {
  const validIds = new Set(chapters.map(chapter => chapter.id));
  Object.keys(completions).forEach(id => {
    if (!validIds.has(id)) delete completions[id];
  });
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    updatedAt: new Date().toISOString(),
    completedAtById: completions
  }));
}

function isDone(chapter) {
  return Boolean(completions[chapter.id]);
}

function todayKey() {
  return localDateKey(new Date());
}

function chapterState(chapter) {
  const today = todayKey();
  if (isDone(chapter)) return 'done';
  if (chapter.date === today) return 'today';
  if (chapter.date < today) return 'overdue';
  return 'future';
}

function chapterName(chapter) {
  return `${courseById[chapter.course].name} ${chapter.label} ${chapter.title}`;
}

function getTotals() {
  const total = chapters.length;
  const done = chapters.filter(isDone).length;
  return {
    total,
    done,
    remaining: total - done,
    pct: total ? Math.round(done / total * 100) : 0,
    firstDate: chapters[0]?.date || PLAN.startDate,
    lastDate: chapters.at(-1)?.date || PLAN.startDate
  };
}

function nextChapter() {
  const today = todayKey();
  return chapters.find(chapter => !isDone(chapter) && chapter.date >= today)
    || chapters.find(chapter => !isDone(chapter))
    || null;
}

function courseStats() {
  return PLAN.courses.map(course => {
    const rows = chapters.filter(chapter => chapter.course === course.id);
    const doneRows = rows.filter(isDone);
    const units = course.units.map(unit => {
      const unitRows = rows.filter(chapter => chapter.unit === unit.id);
      const unitDone = unitRows.filter(isDone);
      return { ...unit, total: unitRows.length, done: unitDone.length };
    });
    return { ...course, total: rows.length, done: doneRows.length, units };
  });
}

function renderHeader() {
  const totals = getTotals();
  document.getElementById('headerProgressText').textContent = `${totals.done} / ${totals.total} 章 · ${totals.pct}%`;
  document.getElementById('headerProgressFill').style.width = `${totals.pct}%`;
  document.getElementById('headerMetrics').innerHTML = [
    ['开始', formatDate(totals.firstDate)],
    ['预计完成', formatDate(totals.lastDate)],
    ['剩余章节', `${totals.remaining}章`],
    ['完成即止', totals.remaining ? '继续打卡' : '已完成']
  ].map(([label, value]) => `
    <div class="header-metric">
      <div class="header-metric-label">${escapeHtml(label)}</div>
      <div class="header-metric-value">${escapeHtml(value)}</div>
    </div>
  `).join('');
}

function renderOverview() {
  const totals = getTotals();
  const stats = courseStats();
  const next = nextChapter();
  document.getElementById('todayDateNote').textContent = formatDate(todayKey());
  document.getElementById('overviewMetrics').innerHTML = [
    ['总章节', `${totals.total}章`, '302 共 11 课，311 共 14 章。'],
    ['已打卡', `${totals.done}章`, `${totals.pct}% 已完成。`],
    ['未完成', `${totals.remaining}章`, totals.remaining ? '按日程继续勾选即可。' : '本项目已经收口。'],
    ['安排方式', '每天1章', `${formatDate(totals.firstDate)} 到 ${formatDate(totals.lastDate)}。`]
  ].map(([label, value, sub]) => `
    <div class="metric-card">
      <div class="metric-label">${escapeHtml(label)}</div>
      <div class="metric-value">${escapeHtml(value)}</div>
      <div class="metric-sub">${escapeHtml(sub)}</div>
    </div>
  `).join('');

  document.getElementById('todayCard').innerHTML = next ? `
    <div class="today-title">${escapeHtml(formatDate(next.date))} · 第 ${next.sequence} 章打卡</div>
    <div class="today-main">${escapeHtml(chapterName(next))}</div>
    <div class="today-meta">${escapeHtml(courseById[next.course].fullName)}｜${escapeHtml(unitById[next.unit].name)}</div>
  ` : `
    <div class="today-title">已完成</div>
    <div class="today-main">所有章节都已打卡。</div>
    <div class="today-meta">这个 LOMA 项目已经结束。</div>
  `;

  document.getElementById('courseGrid').innerHTML = stats.map(course => {
    const pct = course.total ? Math.round(course.done / course.total * 100) : 0;
    return `
      <article class="course-card">
        <div class="course-head">
          <div>
            <div class="course-name">${escapeHtml(course.name)}</div>
            <div class="metric-sub">${escapeHtml(course.fullName)}</div>
          </div>
          <div class="course-pct">${pct}%</div>
        </div>
        <div class="course-stats">
          <span><strong>${course.done}</strong> / ${course.total} 章</span>
          <span>${escapeHtml(course.note)}</span>
        </div>
        <div class="mini-track"><div class="mini-fill" style="width:${pct}%"></div></div>
        ${course.units.map(unit => {
          const unitPct = unit.total ? Math.round(unit.done / unit.total * 100) : 0;
          return `
            <div class="unit-row">
              <div class="unit-label">${escapeHtml(unit.id.split('-')[1].toUpperCase())}</div>
              <div class="unit-name">${escapeHtml(unit.name)}</div>
              <div class="unit-pct">${unit.done}/${unit.total}</div>
            </div>
          `;
        }).join('')}
      </article>
    `;
  }).join('');
}

function renderScheduleFilters() {
  const filters = [
    ['all', '全部'],
    ['today', '今天/逾期'],
    ['302', 'LOMA 302'],
    ['311', 'LOMA 311'],
    ['done', '已完成'],
    ['todo', '未完成']
  ];
  document.getElementById('scheduleFilters').innerHTML = filters.map(([key, label]) => `
    <button class="filter-btn ${scheduleFilter === key ? 'active' : ''}" type="button" onclick="setScheduleFilter('${key}')">${escapeHtml(label)}</button>
  `).join('');
}

function chapterMatchesFilter(chapter) {
  if (scheduleFilter === 'all') return true;
  if (scheduleFilter === 'today') return ['today', 'overdue'].includes(chapterState(chapter));
  if (scheduleFilter === 'done') return isDone(chapter);
  if (scheduleFilter === 'todo') return !isDone(chapter);
  if (['302', '311'].includes(scheduleFilter)) return chapter.course === scheduleFilter;
  return true;
}

function renderChapter(chapter) {
  const state = chapterState(chapter);
  return `
    <div class="chapter-item ${isDone(chapter) ? 'done' : ''} ${state}" onclick="toggleChapter('${chapter.id}')">
      <div class="check">${isDone(chapter) ? '✓' : ''}</div>
      <div class="chapter-info">
        <div class="chapter-title">${escapeHtml(chapterName(chapter))}</div>
        <div class="chapter-meta">
          <span class="tag gray">${escapeHtml(formatDate(chapter.date))}</span>
          <span class="tag blue">第 ${chapter.sequence} 章</span>
          <span class="tag">${escapeHtml(unitById[chapter.unit].name)}</span>
        </div>
        <div class="chapter-note">${escapeHtml(courseById[chapter.course].fullName)}</div>
      </div>
    </div>
  `;
}

function renderSchedule() {
  renderScheduleFilters();
  const query = (document.getElementById('scheduleSearch')?.value || '').trim().toLowerCase();
  const rows = chapters.filter(chapter => {
    const haystack = `${chapter.date} ${formatDate(chapter.date)} ${chapterName(chapter)} ${unitById[chapter.unit].name}`.toLowerCase();
    return chapterMatchesFilter(chapter) && (!query || haystack.includes(query));
  });
  document.getElementById('scheduleNote').textContent = `${rows.length} / ${chapters.length} 章`;
  document.getElementById('scheduleList').innerHTML = rows.length
    ? rows.map(renderChapter).join('')
    : '<div class="empty">没有匹配的章节。</div>';
}

function setScheduleFilter(key) {
  scheduleFilter = key;
  renderSchedule();
}

function renderStructure() {
  document.getElementById('structureGrid').innerHTML = PLAN.courses.flatMap(course => {
    return course.units.map(unit => {
      const rows = chapters.filter(chapter => chapter.unit === unit.id);
      const done = rows.filter(isDone).length;
      const pct = rows.length ? Math.round(done / rows.length * 100) : 0;
      return `
        <article class="unit-card">
          <div class="unit-card-title">${escapeHtml(course.name)} · ${escapeHtml(unit.name)}</div>
          <div class="unit-card-sub">${done} / ${rows.length} 章已打卡</div>
          <div class="mini-track"><div class="mini-fill" style="width:${pct}%"></div></div>
          ${rows.map(chapter => `
            <div class="structure-chapter">
              <div class="structure-chapter-title">${escapeHtml(chapter.label)} ${escapeHtml(chapter.title)}</div>
              <div class="structure-chapter-meta">
                <span>${escapeHtml(formatDate(chapter.date))}</span>
                <span>${isDone(chapter) ? '已完成' : '未完成'}</span>
              </div>
            </div>
          `).join('')}
        </article>
      `;
    });
  }).join('');
}

function renderBackup() {
  const totals = getTotals();
  const records = Object.values(completions);
  const latest = records
    .map(record => record.at)
    .filter(Boolean)
    .sort()
    .at(-1);
  document.getElementById('backupMetrics').innerHTML = [
    ['保存位置', '本机浏览器', '打卡记录保存在当前浏览器的 localStorage。'],
    ['已保存', `${totals.done}章`, `${totals.remaining} 章未完成。`],
    ['最近打卡', latest ? new Date(latest).toLocaleString('zh-CN') : '暂无', '导出 JSON 可换设备备份。'],
    ['项目状态', totals.remaining ? '进行中' : '已完成', totals.remaining ? '全部打卡后即止。' : '所有章节均已完成。']
  ].map(([label, value, sub]) => `
    <div class="metric-card">
      <div class="metric-label">${escapeHtml(label)}</div>
      <div class="metric-value">${escapeHtml(value)}</div>
      <div class="metric-sub">${escapeHtml(sub)}</div>
    </div>
  `).join('');
}

function toggleChapter(id) {
  const chapter = chapters.find(row => row.id === id);
  if (!chapter) return;
  if (completions[id]) {
    delete completions[id];
    showToast('已取消完成');
  } else {
    const now = new Date();
    completions[id] = {
      at: now.toISOString(),
      date: localDateKey(now),
      plannedDate: chapter.date,
      title: chapterName(chapter)
    };
    showToast('已标记完成');
  }
  saveProgress();
  renderAllViews();
}

function switchPage(page) {
  currentPage = page;
  document.querySelectorAll('.page').forEach(el => el.classList.toggle('active', el.id === `page-${page}`));
  document.querySelectorAll('.nav-btn').forEach(el => el.classList.toggle('active', el.id === `nav-${page}`));
  renderCurrentPage();
}

function renderCurrentPage() {
  renderHeader();
  if (currentPage === 'progress') renderOverview();
  if (currentPage === 'schedule') renderSchedule();
  if (currentPage === 'structure') renderStructure();
  if (currentPage === 'backup') renderBackup();
}

function renderAllViews() {
  renderHeader();
  renderOverview();
  if (currentPage === 'schedule') renderSchedule();
  if (currentPage === 'structure') renderStructure();
  if (currentPage === 'backup') renderBackup();
}

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove('show'), 1500);
}

function resetProgress() {
  if (!confirm('确定要清空本机保存的 LOMA 章节打卡进度吗？')) return;
  completions = {};
  saveProgress();
  renderAllViews();
  showToast('进度已清空');
}

function exportProgress() {
  const blob = new Blob([JSON.stringify({
    exportedAt: new Date().toISOString(),
    plan: 'LOMA chapter check-ins',
    completedAtById: completions
  }, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'loma-chapter-checkins.json';
  link.click();
  URL.revokeObjectURL(url);
}

function importProgress(event) {
  const file = event.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(String(reader.result || '{}'));
      completions = parsed.completedAtById || {};
      saveProgress();
      renderAllViews();
      showToast('进度已导入');
    } catch {
      alert('导入失败：JSON 文件格式不正确。');
    } finally {
      event.target.value = '';
    }
  };
  reader.readAsText(file);
}

prepareChapters();
loadProgress();
renderAllViews();
</script>
</body>
</html>
